name: cloakery CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Validation (Lint, TypeCheck, Test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm ci

      - name: Lint & format (Biome), type check (TSC), and run tests (Vitest)
        env:
          RP_ID: localhost
          RP_NAME: Cloakery
        run: npm test

  validate-cd:
    name: Validate CD (OIDC Trust)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-west-1

      - name: Verify Identity
        run: aws sts get-caller-identity

  deploy-stage:
    name: Deploy to Staging
    needs: [validate, validate-cd]
    if: github.event_name == 'pull_request'
    permissions:
      id-token: write # Required to pass OIDC permission to reusable workflow
      contents: read
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      stage: dev
      domain: ${{ vars.DOMAIN_DEV }}
      domain_certificate_arn: ${{ vars.DOMAIN_DEV_CERTIFICATE_ARN }}
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD_DEV }}
      DATABASE_URL: ${{ secrets.DATABASE_URL_DEV }}
      JWT_SECRET: ${{ secrets.JWT_SECRET_DEV }}

  deploy-prod:
    name: Deploy to Production
    needs: [validate, validate-cd]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write # Required to pass OIDC permission to reusable workflow
      contents: read
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      stage: prod
      domain: ${{ vars.DOMAIN_PROD }}
      domain_certificate_arn: ${{ vars.DOMAIN_PROD_CERTIFICATE_ARN }}
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD_PROD }}
      DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET_PROD }}

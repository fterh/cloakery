service: cloakery

provider:
  name: aws
  runtime: nodejs24.x
  region: us-west-1
  domain:
    name: ${param:domain, 'localhost'}
    certificateArn: ${param:domain_certificate_arn, 'arn:aws:acm:us-east-1:000000000000:certificate/local'}
    createRoute53Record: false
  stage: ${opt:stage, 'dev'}
  architecture: arm64 # Faster and cheaper than x86_64
  memorySize: 1024
  timeout: 30
  logRetentionInDays: 7
  httpApi:
    cors: true
  environment:
    TABLE_NAME: !Ref CloakeryKV
    TABLE_NAME_LOCAL_DEV: ${env:TABLE_NAME_LOCAL_DEV, ''}
    DATABASE_URL: ${param:database_url, env:DATABASE_URL}
    JWT_SECRET: ${param:jwt_secret, env:JWT_SECRET}
    RP_ID: ${param:domain, 'localhost'}
    RP_NAME: "Cloakery"
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:DeleteItem
            - dynamodb:UpdateItem
            - dynamodb:Query
          Resource: !GetAtt CloakeryKV.Arn

build:
  esbuild:
    bundle: true
    minify: true
    sourcemap: true
    exclude: ['@aws-sdk/*'] # AWS SDK is pre-installed in the Lambda runtime
    target: node24
    platform: node
    format: esm
    banner:
      js: "import { createRequire } from 'module'; const require = createRequire(import.meta.url);"

plugins:
  - serverless-offline

functions:
  # Proof of Life
  test:
    handler: src/backend/src/test/index.handler
    environment:
      STAGE: ${sls:stage}
    events:
      - httpApi:
          path: /test
          method: get

  # Passkey Authentication - Registration
  registerOptions:
    handler: src/backend/src/auth/register.options
    events:
      - httpApi:
          path: /auth/register/options
          method: post
  registerVerify:
    handler: src/backend/src/auth/register.verify
    events:
      - httpApi:
          path: /auth/register/verify
          method: post

  # Passkey Authentication - Login
  loginOptions:
    handler: src/backend/src/auth/login.options
    events:
      - httpApi:
          path: /auth/login/options
          method: post
  loginVerify:
    handler: src/backend/src/auth/login.verify
    events:
      - httpApi:
          path: /auth/login/verify
          method: post

  # Session Initialization
  me:
    handler: src/backend/src/auth/session.me
    events:
      - httpApi:
          path: /auth/me
          method: get

  # Session Logout
  logout:
    handler: src/backend/src/auth/session.logout
    events:
      - httpApi:
          path: /auth/logout
          method: post

  # Alias Management
  generateAlias:
    handler: src/backend/src/aliases/index.generate
    events:
      - httpApi:
          path: /aliases/generate
          method: get
  listAliases:
    handler: src/backend/src/aliases/index.get
    events:
      - httpApi:
          path: /aliases
          method: get
  createAlias:
    handler: src/backend/src/aliases/index.post
    events:
      - httpApi:
          path: /aliases
          method: post
  updateAlias:
    handler: src/backend/src/aliases/index.patch
    events:
      - httpApi:
          path: /aliases/{id}
          method: patch
  removeAlias:
    handler: src/backend/src/aliases/index.del
    events:
      - httpApi:
          path: /aliases/{id}
          method: delete

  # Inbound Email Pipeline
  inboundProcessor:
    handler: src/backend/src/email/inbound.handler
    # SES triggers will be added here

  # Outbound Email Pipeline
  outboundProcessor:
    handler: src/backend/src/email/outbound.handler
    # SES triggers will be added here

resources:
  Resources:
    # --- Other Resources ---
    CloakeryKV:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${sls:stage}-kv
        AttributeDefinitions:
          - AttributeName: pk
            AttributeType: S
        KeySchema:
          - AttributeName: pk
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST
        TimeToLiveSpecification:
          AttributeName: expires_at
          Enabled: true

    StaticSiteBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:service}-${sls:stage}-static-site
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true

    StaticSiteDistribution:
      Type: AWS::CloudFront::Distribution
      Properties:
        DistributionConfig:
          Origins:
            - Id: S3Origin
              DomainName: !GetAtt StaticSiteBucket.RegionalDomainName
              S3OriginConfig:
                OriginAccessIdentity: ""
              OriginAccessControlId: !GetAtt CloudFrontOriginAccessControl.Id
            - Id: ApiOrigin
              DomainName: !Sub "${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
              CustomOriginConfig:
                OriginProtocolPolicy: https-only
          Enabled: true
          DefaultRootObject: index.html
          DefaultCacheBehavior:
            TargetOriginId: S3Origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD, OPTIONS]
            ForwardedValues:
              QueryString: false
              Cookies:
                Forward: none
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt CloudFrontURLRewriteFunction.FunctionARN
          CacheBehaviors:
            # Route /test to API Gateway
            - PathPattern: /test
              TargetOriginId: ApiOrigin
              ViewerProtocolPolicy: redirect-to-https
              AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
              # Use Managed Policies
              CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # CachingDisabled
              OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3 # AllViewer
            # Route /auth/* to API Gateway
            - PathPattern: /auth/*
              TargetOriginId: ApiOrigin
              ViewerProtocolPolicy: redirect-to-https
              AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
              # Use Managed Policies
              CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # CachingDisabled
              OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3 # AllViewer
            # Route /aliases* to API Gateway
            - PathPattern: /aliases*
              TargetOriginId: ApiOrigin
              ViewerProtocolPolicy: redirect-to-https
              AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
              # Use Managed Policies
              CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # CachingDisabled
              OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3 # AllViewer
          Aliases:
            - ${param:domain, 'localhost'}
          ViewerCertificate:
            AcmCertificateArn: ${param:domain_certificate_arn, 'arn:aws:acm:us-east-1:000000000000:certificate/local'}
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021

    CloudFrontURLRewriteFunction:
      Type: AWS::CloudFront::Function
      Properties:
        Name: ${self:service}-${sls:stage}-spa-rewrite
        AutoPublish: true
        FunctionCode: |
          function handler(event) {
            var request = event.request;
            var uri = request.uri;

            // If the URI doesn't contain a dot, it's a React route.
            // We rewrite it to index.html so S3 can serve the SPA.
            if (!uri.includes('.')) {
              request.uri = '/index.html';
            }

            return request;
          }
        FunctionConfig:
          Comment: Generic SPA URL rewriter (handles deep links)
          Runtime: cloudfront-js-1.0

    CloudFrontOriginAccessControl:
      Type: AWS::CloudFront::OriginAccessControl
      Properties:
        OriginAccessControlConfig:
          Name: ${self:service}-${sls:stage}-oac
          OriginAccessControlOriginType: s3
          SigningBehavior: always
          SigningProtocol: sigv4

    StaticSiteBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref StaticSiteBucket
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Action: s3:GetObject
              Effect: Allow
              Resource: !Sub ${StaticSiteBucket.Arn}/*
              Principal:
                Service: cloudfront.amazonaws.com
              Condition:
                StringEquals:
                  AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${StaticSiteDistribution}

  Outputs:
    StaticSiteBucketName:
      Value: !Ref StaticSiteBucket
    CloudFrontDistributionId:
      Value: !Ref StaticSiteDistribution

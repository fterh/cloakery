service: cloakery

provider:
  name: aws
  runtime: nodejs24.x
  region: us-west-1
  domain:
    name: ${param:domain}
    certificateArn: ${param:domain_certificate_arn}
    createRoute53Record: false
  stage: ${opt:stage, 'dev'}
  architecture: arm64 # Faster and cheaper than x86_64
  memorySize: 1024
  timeout: 30
  logRetentionInDays: 7
  httpApi:
    cors: true
  environment:
    TABLE_NAME: !Ref CloakeryKV
    DATABASE_URL: 
      Fn::Join:
        - ""
        - - "postgres://cloakery_admin:"
          - ${param:db_password}
          - "@"
          - !GetAtt CloakeryDB.Endpoint.Address
          - ":5432/cloakery"
    JWT_SECRET: ${param:jwt_secret}
    RP_ID: ${param:domain}
    RP_NAME: "Cloakery"
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:DeleteItem
            - dynamodb:UpdateItem
            - dynamodb:Query
          Resource: !GetAtt CloakeryKV.Arn

custom:
  vpcConfig: &vpcConfig
    securityGroupIds:
      - !Ref LambdaSecurityGroup
    subnetIds:
      - !Ref PrivateSubnetA # Single AZ for cost optimization

build:
  esbuild:
    bundle: true
    minify: true
    sourcemap: true
    exclude: ['@aws-sdk/*'] # AWS SDK is pre-installed in the Lambda runtime
    target: node24
    platform: node
    format: esm
    banner:
      js: "import { createRequire } from 'module'; const require = createRequire(import.meta.url);"

functions:
  # Proof of Life
  test:
    handler: src/backend/src/test/index.handler
    environment:
      STAGE: ${sls:stage}
    events:
      - httpApi:
          path: /test
          method: get

  migrate:
    handler: src/backend/src/lib/migrate.handler
    vpc: *vpcConfig

  # Passkey Authentication - Registration
  registerOptions:
    handler: src/backend/src/auth/register.options
    vpc: *vpcConfig
    events:
      - httpApi:
          path: /auth/register/options
          method: post
  registerVerify:
    handler: src/backend/src/auth/register.verify
    vpc: *vpcConfig
    events:
      - httpApi:
          path: /auth/register/verify
          method: post

  # Passkey Authentication - Login
  loginOptions:
    handler: src/backend/src/auth/login.options
    vpc: *vpcConfig
    events:
      - httpApi:
          path: /auth/login/options
          method: post
  loginVerify:
    handler: src/backend/src/auth/login.verify
    vpc: *vpcConfig
    events:
      - httpApi:
          path: /auth/login/verify
          method: post

  # Session Initialization
  me:
    handler: src/backend/src/auth/session.me
    vpc: *vpcConfig
    events:
      - httpApi:
          path: /auth/me
          method: get

  # Session Logout
  logout:
    handler: src/backend/src/auth/session.logout
    events:
      - httpApi:
          path: /auth/logout
          method: post

  # Inbound Email Pipeline
  inboundProcessor:
    handler: src/backend/src/email/inbound.handler
    # SES triggers will be added here

  # Outbound Email Pipeline
  outboundProcessor:
    handler: src/backend/src/email/outbound.handler
    # SES triggers will be added here

resources:
  Resources:
    # --- Networking (VPC) ---
    VPC:
      Type: AWS::EC2::VPC
      Properties:
        CidrBlock: 10.0.0.0/16
        EnableDnsSupport: true
        EnableDnsHostnames: true
        Tags:
          - Key: Name
            Value: ${self:service}-${sls:stage}-vpc

    # Private Subnets (for RDS and Lambda)
    PrivateSubnetA:
      Type: AWS::EC2::Subnet
      Properties:
        VpcId: !Ref VPC
        CidrBlock: 10.0.3.0/24
        AvailabilityZone: ${self:provider.region}a

    PrivateSubnetB:
      Type: AWS::EC2::Subnet
      Properties:
        VpcId: !Ref VPC
        CidrBlock: 10.0.4.0/24
        AvailabilityZone: ${self:provider.region}b

    # --- VPC Endpoints (Cost Optimization) ---
    # Gateway Endpoints (Free)
    DynamoDBEndpoint:
      Type: AWS::EC2::VPCEndpoint
      Properties:
        ServiceName: !Sub com.amazonaws.${AWS::Region}.dynamodb
        VpcId: !Ref VPC
        RouteTableIds:
          - !Ref PrivateRouteTable

    S3Endpoint:
      Type: AWS::EC2::VPCEndpoint
      Properties:
        ServiceName: !Sub com.amazonaws.${AWS::Region}.s3
        VpcId: !Ref VPC
        RouteTableIds:
          - !Ref PrivateRouteTable

    # Interface Endpoints (Low Cost)
    SESEndpoint:
      Type: AWS::EC2::VPCEndpoint
      Properties:
        ServiceName: !Sub com.amazonaws.${AWS::Region}.email
        VpcId: !Ref VPC
        VpcEndpointType: Interface
        PrivateDnsEnabled: true
        SubnetIds:
          - !Ref PrivateSubnetA
        SecurityGroupIds:
          - !Ref SESEndpointSecurityGroup

    SESEndpointSecurityGroup:
      Type: AWS::EC2::SecurityGroup
      Properties:
        GroupDescription: Security group for SES VPC Endpoint
        VpcId: !Ref VPC
        SecurityGroupIngress:
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            SourceSecurityGroupId: !Ref LambdaSecurityGroup

    # Route Tables
    PrivateRouteTable:
      Type: AWS::EC2::RouteTable
      Properties:
        VpcId: !Ref VPC

    PrivateSubnetARouteTableAssociation:
      Type: AWS::EC2::SubnetRouteTableAssociation
      Properties:
        SubnetId: !Ref PrivateSubnetA
        RouteTableId: !Ref PrivateRouteTable

    PrivateSubnetBRouteTableAssociation:
      Type: AWS::EC2::SubnetRouteTableAssociation
      Properties:
        SubnetId: !Ref PrivateSubnetB
        RouteTableId: !Ref PrivateRouteTable

    # --- Security Groups ---
    LambdaSecurityGroup:
      Type: AWS::EC2::SecurityGroup
      Properties:
        GroupDescription: Security group for Cloakery Lambda functions
        VpcId: !Ref VPC
        SecurityGroupEgress:
          - IpProtocol: -1
            CidrIp: 0.0.0.0/0

    DBSecurityGroup:
      Type: AWS::EC2::SecurityGroup
      Properties:
        GroupDescription: Security group for Cloakery RDS instance
        VpcId: !Ref VPC
        SecurityGroupIngress:
          - IpProtocol: tcp
            FromPort: 5432
            ToPort: 5432
            SourceSecurityGroupId: !Ref LambdaSecurityGroup

    # --- RDS Resources ---
    DBSubnetGroup:
      Type: AWS::RDS::DBSubnetGroup
      Properties:
        DBSubnetGroupDescription: Subnets for Cloakery RDS
        SubnetIds:
          - !Ref PrivateSubnetA
          - !Ref PrivateSubnetB

    CloakeryDB:
      Type: AWS::RDS::DBInstance
      Properties:
        DBInstanceIdentifier: ${self:service}-${sls:stage}-db
        DBName: cloakery
        Engine: postgres
        EngineVersion: "16"
        DBInstanceClass: db.t4g.micro
        AllocatedStorage: "20"
        MasterUsername: cloakery_admin
        MasterUserPassword: ${param:db_password}
        DBSubnetGroupName: !Ref DBSubnetGroup
        VPCSecurityGroups:
          - !Ref DBSecurityGroup
        PubliclyAccessible: false
        StorageType: gp3
        BackupRetentionPeriod: 7
        DeletionProtection: false # Set to true for production

    # --- Other Resources ---
    CloakeryKV:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${sls:stage}-kv
        AttributeDefinitions:
          - AttributeName: pk
            AttributeType: S
        KeySchema:
          - AttributeName: pk
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST
        TimeToLiveSpecification:
          AttributeName: expires_at
          Enabled: true

    StaticSiteBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:service}-${sls:stage}-static-site
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true

    StaticSiteDistribution:
      Type: AWS::CloudFront::Distribution
      Properties:
        DistributionConfig:
          Origins:
            - Id: S3Origin
              DomainName: !GetAtt StaticSiteBucket.RegionalDomainName
              S3OriginConfig:
                OriginAccessIdentity: ""
              OriginAccessControlId: !GetAtt CloudFrontOriginAccessControl.Id
            - Id: ApiOrigin
              DomainName: !Sub "${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
              CustomOriginConfig:
                OriginProtocolPolicy: https-only
          Enabled: true
          DefaultRootObject: index.html
          DefaultCacheBehavior:
            TargetOriginId: S3Origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD, OPTIONS]
            ForwardedValues:
              QueryString: false
              Cookies:
                Forward: none
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt CloudFrontURLRewriteFunction.FunctionARN
          CacheBehaviors:
            # Route /test to API Gateway
            - PathPattern: /test
              TargetOriginId: ApiOrigin
              ViewerProtocolPolicy: redirect-to-https
              AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
              # Use Managed Policies
              CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # CachingDisabled
              OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3 # AllViewer
            # Route /auth/* to API Gateway
            - PathPattern: /auth/*
              TargetOriginId: ApiOrigin
              ViewerProtocolPolicy: redirect-to-https
              AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
              # Use Managed Policies
              CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # CachingDisabled
              OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3 # AllViewer
          Aliases:
            - ${param:domain}
          ViewerCertificate:
            AcmCertificateArn: ${param:domain_certificate_arn}
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021

    CloudFrontURLRewriteFunction:
      Type: AWS::CloudFront::Function
      Properties:
        Name: ${self:service}-${sls:stage}-spa-rewrite
        AutoPublish: true
        FunctionCode: |
          function handler(event) {
            var request = event.request;
            var uri = request.uri;

            // If the URI doesn't contain a dot, it's a React route.
            // We rewrite it to index.html so S3 can serve the SPA.
            if (!uri.includes('.')) {
              request.uri = '/index.html';
            }

            return request;
          }
        FunctionConfig:
          Comment: Generic SPA URL rewriter (handles deep links)
          Runtime: cloudfront-js-1.0

    CloudFrontOriginAccessControl:
      Type: AWS::CloudFront::OriginAccessControl
      Properties:
        OriginAccessControlConfig:
          Name: ${self:service}-${sls:stage}-oac
          OriginAccessControlOriginType: s3
          SigningBehavior: always
          SigningProtocol: sigv4

    StaticSiteBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref StaticSiteBucket
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Action: s3:GetObject
              Effect: Allow
              Resource: !Sub ${StaticSiteBucket.Arn}/*
              Principal:
                Service: cloudfront.amazonaws.com
              Condition:
                StringEquals:
                  AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${StaticSiteDistribution}

  Outputs:
    StaticSiteBucketName:
      Value: !Ref StaticSiteBucket
    CloudFrontDistributionId:
      Value: !Ref StaticSiteDistribution

